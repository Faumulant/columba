name: CI

# 只跑 Windows：这是本项目当前唯一交付平台。
# Linux/macOS 端暂不做（等有需求时再开），届时把下面的 runs-on
# 换成 matrix 并补 platform_other.go 的实现即可。
#
# 两个坑（历史记录见提交信息）：
#   - build.bat 必须用 go.work（third_party/go-webview2 的 replace 只在那里），
#     而 gomobile bind 反过来要求 GOWORK=off。CI 里两者分开跑。
#   - 安卓 AAR/APK 不在 CI 构建（需要 Android SDK + gomobile 工具链，耗时数分钟），
#     只在 Go 侧验证 mobileapi 能编过。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: 编译 + 测试（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 编译（含 go.work 的 fork replace）
        run: go build ./...

      - name: gofmt 检查
        shell: bash
        run: |
          out=$(gofmt -l cmd core platform tools)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: go vet
        shell: bash
        run: |
          # platform_windows.go 有 4 条历史 unsafe.Pointer 提示：窗类名/窗口名转
          # uintptr 存结构体的模式，RegisterClassExW 同步拷贝字符串故实际安全
          #（历史记录见提交信息）。只豁免这一条已知项，其余 vet 失败照常拦。
          #
          # 两个坑（2026-10-21 首次 CI 实跑踩到）：
          #   ① runner 的 bash 带 -e -o pipefail：`go vet | tee` 在 vet 非零时
          #      整条管道立刻失败退出，后面的过滤根本执行不到；
          #   ② vet 把诊断写 stderr，Actions 会把每一行标成 ##[error]，但那是
          #      显示层的标注，不影响脚本判断——真正的问题是 ①。
          # 所以先把输出落文件、用 `|| true` 兜住退出码，再判内容。
          go vet ./... > /tmp/vet.log 2>&1 || true
          if [ ! -s /tmp/vet.log ]; then
            echo "vet 无输出，通过"
            exit 0
          fi
          rest=$(grep -vE 'platform_windows\.go:[0-9]+:[0-9]+: possible misuse of unsafe\.Pointer' /tmp/vet.log || true)
          if [ -n "$rest" ]; then
            echo "存在未豁免的 vet 问题："
            echo "$rest"
            exit 1
          fi
          echo "仅剩已论证的 unsafe.Pointer 提示，放行"

      - name: 单元测试
        run: go test -count=1 -timeout 300s ./...

      - name: 构建发布产物
        shell: bash
        run: |
          go build -ldflags "-s -w" -o drop.exe ./cmd/drop
          go build -ldflags "-s -w -H windowsgui" -o dropw.exe ./cmd/drop
          ls -lh drop.exe dropw.exe

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: columba-windows
          path: |
            drop.exe
            dropw.exe
            extension/
          retention-days: 14

  android-bridge:
    name: 安卓桥接层编译
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: 验证 core/mobileapi 可交叉编译到 Android
        # gomobile bind 需要完整 Android SDK + NDK，太重；这里只确认桥接层
        # 在 android/arm64 目标下能编过（gomobile 也是走这个目标）。
        env:
          GOOS: android
          GOARCH: arm64
        run: go build ./core/mobileapi
