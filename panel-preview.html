<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Drop 面板 · 设计预览</title>
<style>
  :root{
    --blue:#2563eb; --blue-soft:#eef4ff; --green:#16a34a; --red:#dc2626;
    --bg:#f6f7f9; --card:#ffffff; --line:#ececf0; --txt:#1c1e21; --sub:#8a8f98;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  body{background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;user-select:none}

  /* ── 顶部条：设备选择器常驻于此 ── */
  .topbar{height:58px;display:flex;align-items:center;padding:0 14px;
          border-bottom:1px solid var(--line);background:var(--card)}
  .dev{position:relative;width:200px}

  /* ── 整体两栏 ── */
  .app{display:flex;height:calc(100vh - 58px)}

  /* ── 左侧分类栏 ── */
  .side{width:172px;background:var(--card);border-right:1px solid var(--line);
        display:flex;flex-direction:column;padding:10px 10px 14px}
  .nav{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;
       cursor:pointer;color:#4b5563;font-size:14px;transition:all .18s ease}
  .nav svg{width:17px;height:17px;flex:none}
  .nav:hover{background:#f1f3f6}
  .nav.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
  .side .spacer{flex:1}
  .gear{color:#6b7280}
  .gear:hover{background:#f1f3f6;color:var(--txt)}

  /* ── 设备选择器 ── */
  .dev{position:relative;width:200px}
  .dev-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;
           background:var(--card);border:1px solid var(--line);border-radius:12px;
           cursor:pointer;transition:box-shadow .18s,border-color .18s}
  .dev-btn:hover{border-color:#c9d4ea;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .dev-btn .name{font-size:13.5px;font-weight:600;flex:1;text-align:left}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.on{background:var(--green);animation:pulse 2.2s infinite}
  .dot.off{background:#c4c8cf}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.35)}50%{box-shadow:0 0 0 5px rgba(22,163,74,0)}}
  .caret{width:10px;height:10px;fill:#9ca3af;transition:transform .18s}
  .dev.open .caret{transform:rotate(180deg)}
  .dev-menu{position:absolute;top:46px;left:0;right:0;background:var(--card);
            border:1px solid var(--line);border-radius:14px;overflow:hidden;
            box-shadow:0 10px 32px rgba(15,23,42,.14);opacity:0;transform:scale(.97) translateY(-4px);
            pointer-events:none;transition:all .16s ease}
  .dev.open .dev-menu{opacity:1;transform:none;pointer-events:auto}
  .dev-item{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-size:13.5px}
  .dev-item:hover{background:var(--blue-soft)}
  .dev-item .id{margin-left:auto;font-size:11px;color:var(--sub)}

  /* ── 主区 ── */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .head{padding:18px 26px 10px;display:flex;align-items:baseline;gap:12px}
  .head h1{font-size:19px;font-weight:700}
  .head .count{font-size:12px;color:var(--sub)}
  .list{flex:1;overflow-y:auto;padding:2px 18px 18px}
  .row{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:12px;
       background:var(--card);margin-bottom:8px;border:1px solid transparent;
       transition:all .18s ease;animation:in .28s ease}
  @keyframes in{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
  .row:hover{border-color:#dbe7ff;box-shadow:0 2px 10px rgba(37,99,235,.07)}
  .fico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
        justify-content:center;flex:none;color:#fff}
  .fico svg{width:19px;height:19px}
  .f-doc{background:#3b82f6}.f-aud{background:#a855f7}.f-img{background:#f59e0b}
  .f-vid{background:#f43f5e}.f-txt{background:#10b981}
  .seg{display:flex;background:#f1f3f6;border-radius:9px;padding:3px;margin-left:6px}
  .seg b{font-size:12px;padding:4px 13px;border-radius:7px;cursor:pointer;color:#5b6472;
         font-weight:500;transition:all .15s}
  .seg b.on{background:#fff;color:var(--txt);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .fmeta{flex:1;min-width:0}
  .fname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{font-size:12px;padding:4px 11px;border-radius:99px;white-space:nowrap;flex:none}
  .chip.in{background:#ecfdf5;color:#059669}
  .chip.out{background:#eff6ff;color:#2563eb}
  .time{font-size:12px;color:var(--sub);width:52px;text-align:right;flex:none}
  .st{width:26px;text-align:center;font-size:15px;font-weight:700;flex:none}
  .st.ok{color:var(--green)}.st.bad{color:var(--red)}
  .acts{display:flex;gap:6px;opacity:0;transition:opacity .18s;
        min-width:118px;justify-content:flex-end;flex:none}
  .row:hover .acts{opacity:1}
  .btn{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);
       background:#fff;cursor:pointer;color:#374151;transition:all .15s}
  .btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
  .btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.pri:hover{background:#1d4fd7}

  /* ── 文本页 ── */
  .composer{margin:0 18px 14px;background:var(--card);border:1px solid var(--line);
            border-radius:14px;padding:13px;transition:border-color .18s}
  .composer:focus-within{border-color:var(--blue)}
  .composer textarea{width:100%;height:72px;border:none;outline:none;resize:none;
                     font-size:13.5px;line-height:1.55;font-family:inherit;background:transparent}
  .composer .bar{display:flex;justify-content:flex-end}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:13px 15px;margin:0 18px 8px;animation:in .28s ease}
  .tcard .thead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:7px}
  .tcard .tbody{font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
                max-height:120px;overflow:hidden}
  .tcard .copy{margin-left:auto}

  /* ── 设置 ── */
  .set{padding:8px 26px 28px;max-width:620px;margin:0 auto;width:100%}
  .set h2{font-size:13px;color:var(--sub);font-weight:600;margin:22px 0 8px}
  .setcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
  .setrow{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
  .setrow:last-child{border-bottom:none}
  .setrow .k{font-size:13.5px;font-weight:550;flex:none}
  .setrow .v{font-size:12.5px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;
             white-space:nowrap;text-align:right}
  .x{width:26px;height:26px;border-radius:8px;border:none;background:#f3f4f6;color:#9ca3af;
     cursor:pointer;font-size:14px;transition:all .15s}
  .x:hover{background:#fee2e2;color:var(--red)}
  .add{width:100%;padding:12px;margin-top:10px;border:1.5px dashed #c9d4ea;border-radius:12px;
       background:none;color:var(--blue);font-size:13.5px;cursor:pointer;transition:all .15s}
  .add:hover{background:var(--blue-soft);border-color:var(--blue)}

  /* ── 配对弹窗 ── */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:90;display:none;
        align-items:center;justify-content:center}
  .mask.show{display:flex}
  .modal{width:360px;background:var(--card);border-radius:18px;padding:22px;
         box-shadow:0 18px 50px rgba(15,23,42,.25);animation:in .22s ease}
  .tabs{display:flex;background:#f1f3f6;border-radius:10px;padding:3px;margin:14px 0 16px}
  .tab{flex:1;text-align:center;font-size:12.5px;padding:7px;border-radius:8px;cursor:pointer;color:#5b6472}
  .tab.on{background:#fff;color:var(--txt);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .code{font-size:34px;letter-spacing:9px;text-align:center;font-weight:750;color:var(--blue);
        padding:16px 0 6px;font-variant-numeric:tabular-nums}
  .wait{text-align:center;font-size:12.5px;color:var(--sub);margin-bottom:6px}
  input.codein{width:100%;font-size:24px;letter-spacing:8px;text-align:center;padding:11px;
        border:1.5px solid var(--line);border-radius:12px;outline:none;font-variant-numeric:tabular-nums}
  input.codein:focus{border-color:var(--blue)}

  /* ── 拖拽覆盖层 & toast ── */
  .drop{position:fixed;inset:10px;border:2.5px dashed var(--blue);border-radius:18px;
        background:rgba(37,99,235,.07);z-index:80;display:none;align-items:center;justify-content:center}
  .drop.show{display:flex}
  .drop span{font-size:16px;font-weight:600;color:var(--blue);background:#fff;
             padding:12px 22px;border-radius:99px;box-shadow:0 6px 24px rgba(37,99,235,.2)}
  .toasts{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:9px}
  .toast{background:#111827;color:#f9fafb;font-size:13px;padding:11px 16px;border-radius:12px;
         box-shadow:0 8px 26px rgba(0,0,0,.25);animation:in .25s ease}
  .toast.err{background:#7f1d1d}
</style>
</head>
<body>
<div class="topbar">
  <div class="dev" id="dev">
    <button class="dev-btn" onclick="devToggle()">
      <span class="dot on"></span><span class="name" id="devName">我的手机</span>
      <svg class="caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6z"/></svg>
    </button>
    <div class="dev-menu" id="devMenu"></div>
  </div>
</div>
<div class="app">
  <div class="side" id="side">
    <div class="nav" data-c="doc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>文件</div>
    <div class="nav" data-c="aud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>音频</div>
    <div class="nav" data-c="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>图片</div>
    <div class="nav" data-c="vid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M22 8l-6 4 6 4z"/></svg>视频</div>
    <div class="nav" data-c="txt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>文本</div>
    <div class="spacer"></div>
    <div class="nav gear" id="gear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>设置</div>
  </div>

  <div class="main" id="main"></div>
</div>

<div class="drop" id="dropOv"><span>松开发送到「<b id="dropTarget">我的手机</b>」</span></div>
<div class="toasts" id="toasts"></div>

<div class="mask" id="pairMask">
  <div class="modal">
    <b>添加设备</b>
    <div class="tabs">
      <div class="tab on" onclick="pairTab(0)">显示配对码</div>
      <div class="tab" onclick="pairTab(1)">输入配对码</div>
    </div>
    <div id="pairA">
      <div class="code">428 315</div>
      <div class="wait">5 分钟内有效 · 对方加入时在这里确认</div>
    </div>
    <div id="pairB" style="display:none">
      <input class="codein" maxlength="7" placeholder="······">
      <div class="wait" style="margin-top:8px">输入对方设备上显示的 6 位配对码</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn" style="flex:1;padding:9px" onclick="pairClose()">取消</button>
      <button class="btn pri" style="flex:1;padding:9px" onclick="pairClose()">完成</button>
    </div>
  </div>
</div>

<script>
const DEVICES=[
  {name:"我的手机",on:true},{name:"老笔记本",on:true},{name:"平板",on:false}
];
let target=DEVICES[0],cat="doc",view="list";
const DATA={
 doc:[["项目方案 v3.pdf","← 手机","14:02",1],["报告终稿.docx","→ 手机","13:58",1],
      ["合同扫描件.zip","← 手机","昨天",1],["读书笔记.md","← 手机","昨天",1],["年会照片打包.rar","→ 手机","前天",0]],
 aud:[["播客 · 第 12 期.mp3","← 手机","15:20",1],["会议录音 1014.m4a","→ 手机","昨天",1],["背景音乐-轻快.wav","→ 手机","3 天前",0]],
 pic:[["出游合影.jpg","← 手机","15:40",1],["设计稿定稿.png","→ 手机","昨天",1],["猫猫.gif","← 手机","2 天前",1],["截图 10-14.png","← 手机","3 天前",0]],
 vid:[["产品演示.mp4","← 手机","12:31",1],["屏幕录制 10-14.mkv","→ 手机","昨天",1],["旅行 vlog.mov","← 手机","上周",1]]
};
const ICON={doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
 aud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
 pic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
 vid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M22 8l-6 4 6 4z"/></svg>',
 txt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>'};
const CLS={doc:"f-doc",aud:"f-aud",pic:"f-img",vid:"f-vid",txt:"f-txt"};
const TITLES={doc:"文件",aud:"音频",pic:"图片",vid:"视频",txt:"文本"};
let filt="all";
const FILTERS=[["all","全部"],["in","收到"],["out","发出"]];
function dirOf(d){return d.startsWith("←")?"in":"out"}
function setFilt(f){filt=f;render()}
function segHTML(){
 return `<div class="seg">${FILTERS.map(([k,l])=>
  `<b class="${filt===k?"on":""}" onclick="setFilt('${k}')">${l}</b>`).join("")}</div>`;
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function fileRow(r){
 const [n,d,t,ok]=r;
 const chip=d.startsWith("←")
  ?`<span class="chip in">← 收到 · ${d.slice(2)}</span>`
  :`<span class="chip out">→ 发出 · ${d.slice(2)}</span>`;
 const acts=ok&&d.startsWith("←")
  ?'<div class="acts"><button class="btn">打开</button><button class="btn">定位</button></div>'
  :'<div class="acts"></div>';
 return `<div class="row"><div class="fico ${CLS[cat]}">${ICON[cat]}</div>
  <div class="fmeta"><div class="fname">${esc(n)}</div></div>
  ${chip}<span class="time">${t}</span>
  <span class="st ${ok?"ok":"bad"}">${ok?"✓":"✗"}</span>${acts}</div>`;
}
function render(){
 const m=document.getElementById("main");
 if(view==="set"){
  m.innerHTML=`<div class="set">
   <div class="head" style="padding:0 0 4px"><h1>设置</h1><span class="count">接收与设备管理</span></div>
   <h2>接收文件夹</h2>
   <div class="setcard"><div class="setrow"><span class="k">保存位置</span>
   <span class="v">C:\\Users\\Faumu\\Downloads\\Drop</span>
   <button class="btn">更改</button><button class="btn">打开</button></div></div>
   <h2>设备管理</h2><div class="setcard" id="devlist">
   ${DEVICES.map((d,i)=>`<div class="setrow"><span class="dot ${d.on?"on":"off"}"></span>
   <span class="k">${d.name}</span><span class="v">${d.on?"在线":"离线"} · 设备 ID C1D4…62CA1</span>
   <button class="x" title="移除">✕</button></div>`).join("")}
   <button class="add" onclick="pairOpen()">＋ 添加设备</button></div></div>`;
  return;
 }
 if(cat==="txt"){
  const texts=TEXTS.filter(t=>filt==="all"||t.d===filt);
  m.innerHTML=`<div class="head"><h1>文本</h1>${segHTML()}
   <span class="count">粘贴或输入，直接发给选中的设备</span></div>
   <div class="composer"><textarea id="ta" placeholder="在这里输入或粘贴文字…"></textarea>
   <div class="bar"><button class="btn pri" onclick="sendText()">发送给「${target.name}」</button></div></div>
   <div id="tlist">${texts.map(tcard).join("")||'<div style="text-align:center;color:var(--sub);font-size:13px;padding:30px 0">该筛选下暂无文本</div>'}</div>`;
  return;
 }
 const rows=DATA[cat].filter(r=>filt==="all"||dirOf(r[1])===filt).map(fileRow).join("");
 m.innerHTML=`<div class="head"><h1>${TITLES[cat]}</h1>${segHTML()}
  <span class="count">${rows?DATA[cat].filter(r=>filt==="all"||dirOf(r[1])===filt).length:0} 条</span></div>
  <div class="list">${rows||'<div style="text-align:center;color:var(--sub);font-size:13px;padding:30px 0">该筛选下暂无传输</div>'}</div>`;
}
let TEXTS=[
 {d:"in",who:"我的手机",t:"14:22",c:"明天上午十点例会，记得带上季度的数据表，地点还是老会议室。"},
 {d:"out",who:"老笔记本",t:"昨天",c:"这篇文章的第三段写得有问题，回头改一下：https://example.com/a?id=8"},
 {d:"in",who:"我的手机",t:"昨天",c:"WiFi 密码改成了 drop2026，来了客人跟人家说一声。"}];
function tcard(t){
 const dir=t.d==="in"?"←":"→";
 return `<div class="tcard"><div class="thead">${dir} ${t.who} · ${t.t}<button class="btn copy" onclick="toast('已复制到剪贴板')">复制</button></div>
   <div class="tbody">${esc(t.c)}</div></div>`;
}
function sendText(){
 const ta=document.getElementById("ta");
 if(!ta.value.trim())return toast("先写点内容",1);
 TEXTS.unshift({d:"out",who:target.name,t:new Date().toTimeString().slice(0,5),c:ta.value});
 ta.value="";filt="all";render();toast("已发送到「"+target.name+"」");
}
/* 设备下拉 */
function devToggle(){
 const d=document.getElementById("dev");
 if(d.classList.toggle("open")){
  document.getElementById("devMenu").innerHTML=DEVICES.map((d,i)=>
   `<div class="dev-item" onclick="devPick(${i})"><span class="dot ${d.on?"on":"off"}"></span>${d.name}
    <span class="id">${d.on?"在线":"离线"}</span></div>`).join("");
 }
}
function devPick(i){target=DEVICES[i];document.getElementById("devName").textContent=target.name;
 document.getElementById("dev").classList.remove("open");render();}
document.addEventListener("click",e=>{if(!document.getElementById("dev").contains(e.target))
 document.getElementById("dev").classList.remove("open")});
/* 分类切换 */
document.querySelectorAll("#side .nav[data-c]").forEach(n=>{
 n.onclick=()=>{view="list";cat=n.dataset.c;

function pairOpen(){document.getElementById("pairMask").classList.add("show")}
function pairClose(){document.getElementById("pairMask").classList.remove("show")}
function pairTab(i){document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("on",i===j));
 document.getElementById("pairA").style.display=i?"none":"block";
 document.getElementById("pairB").style.display=i?"block":"none";}
/* 拖拽 = 发送 */
let dragN=0;
window.addEventListener("dragenter",e=>{e.preventDefault();dragN++;document.getElementById("dropOv").classList.add("show")});
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("dragleave",e=>{if(--dragN<=0){dragN=0;document.getElementById("dropOv").classList.remove("show")}});
window.addEventListener("drop",e=>{e.preventDefault();dragN=0;document.getElementById("dropOv").classList.remove("show");
 const n=e.dataTransfer.files.length?e.dataTransfer.files[0].name:"示例文件.pdf";
 toast("正在发送 "+n+" → "+target.name);
 setTimeout(()=>toast(n+" 已发送到「"+target.name+"」"),1400);});
/* toast */
function toast(msg,err){
 const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=msg;
 document.getElementById("toasts").appendChild(t);
 setTimeout(()=>{t.style.opacity=0;t.style.transition="opacity .4s";setTimeout(()=>t.remove(),400)},2600);
}
