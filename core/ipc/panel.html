<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Columba</title>
<style>
/* ===== 基础 ===== */
:root{--blue:#2563eb;--blue-soft:#eef4ff;--green:#16a34a;--red:#dc2626;
      --bg:#f6f7f9;--card:#fff;--line:#ececf0;--txt:#1c1e21;--sub:#8a8f98}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
body{background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;user-select:none}
.btn{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:#374151;transition:all .15s}
.btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#1d4fd7}
.btn.errb{color:var(--red);border-color:var(--red)}

/* ===== 顶部条：设备选择 ===== */
.topbar{height:58px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);background:var(--card)}
.dev{position:relative;width:200px}
.dev-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:box-shadow .18s,border-color .18s}
.dev-btn:hover{border-color:#c9d4ea;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.dev-btn .name{font-size:13.5px;font-weight:600;flex:1;text-align:left}
.dev-btn .caret{width:10px;height:10px;fill:#9ca3af;transition:transform .18s;margin-left:auto}
.dev.open .caret{transform:rotate(180deg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.on{background:var(--green);animation:pulse 2.2s infinite}
.dot.off{background:#c4c8cf}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.35)}50%{box-shadow:0 0 0 5px rgba(22,163,74,0)}}
.dev-menu{position:absolute;top:46px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 32px rgba(15,23,42,.14);opacity:0;transform:scale(.97) translateY(-4px);pointer-events:none;transition:all .16s ease;z-index:50}
.dev.open .dev-menu{opacity:1;transform:none;pointer-events:auto}
.dev-item{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-size:13.5px}
.dev-item:hover{background:var(--blue-soft)}
.dev-item .id{margin-left:auto;font-size:11px;color:var(--sub)}

/* ===== 主框架 ===== */
.app{display:flex;height:calc(100vh - 58px)}
.side{width:172px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 10px 14px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer;color:#4b5563;font-size:14px;transition:all .18s ease}
.nav svg{width:17px;height:17px;flex:none}
.nav:hover{background:#f1f3f6}
.nav.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.side .spacer{flex:1}
.gear{color:#6b7280}
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* ===== 列表页 ===== */
.head{padding:18px 26px 10px;display:flex;align-items:center;gap:12px}
.head h1{font-size:19px;font-weight:700}
.head .count{font-size:12px;color:var(--sub)}
.head .flex{flex:1}
.seg{display:flex;background:#f1f3f6;border-radius:9px;padding:3px}
.seg b{font-size:12px;padding:4px 13px;border-radius:7px;cursor:pointer;color:#5b6472;font-weight:500;transition:all .15s}
.seg b.on{background:#fff;color:var(--txt);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{flex:1;overflow-y:auto;padding:2px 18px 18px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:30px 0}

/* 文件行 */
.row{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:12px;background:var(--card);margin-bottom:8px;border:1px solid transparent;transition:border-color .18s,box-shadow .18s}
.row:hover{border-color:#dbe7ff;box-shadow:0 2px 10px rgba(37,99,235,.07)}
.row.cur{cursor:pointer}
.fico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.fico svg{width:19px;height:19px}
.f-doc{background:#3b82f6}.f-aud{background:#a855f7}.f-img{background:#f59e0b}
.f-vid{background:#f43f5e}.f-txt{background:#10b981}
.fmeta{flex:1;min-width:0}
.fname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;padding:4px 11px;border-radius:99px;white-space:nowrap;flex:none}
.chip.in{background:#ecfdf5;color:#059669}
.chip.out{background:#eff6ff;color:#2563eb}
.time{font-size:12px;color:var(--sub);width:52px;text-align:right;flex:none}
.st{width:26px;text-align:center;font-size:15px;font-weight:700;flex:none}
.st.ok{color:var(--green)}.st.bad{color:var(--red)}
.acts{display:flex;gap:6px;opacity:0;transition:opacity .18s;min-width:118px;justify-content:flex-end;flex:none}
.row:hover .acts{opacity:1}
.ck{width:16px;height:16px;accent-color:var(--blue);flex:none;cursor:pointer}

/* 文本页 */
.composer{margin:0 18px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;transition:border-color .18s}
.composer:focus-within{border-color:var(--blue)}
.composer textarea{width:100%;height:76px;border:none;outline:none;resize:none;font-size:15px;line-height:1.55;font-family:inherit;background:transparent}
.composer .bar{display:flex;justify-content:flex-end}
.tcard{cursor:pointer;display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:0 18px 8px;transition:border-color .18s}
.tcard:hover{border-color:#dbe7ff}
.tmain{flex:1;min-width:0}
.tcard .thead{display:flex;align-items:center;font-size:12px;color:var(--sub);margin-bottom:7px}
.tcard .tbody{font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;height:70px;overflow:hidden}

/* ===== 设置页 ===== */
.set{padding:8px 26px 28px;max-width:620px;margin:0 auto;width:100%}
.set h2{font-size:13px;color:var(--sub);font-weight:600;margin:26px 0 14px}
.setcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.setrow{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .k{font-size:13.5px;font-weight:550;flex:none}
.setrow .v{font-size:12.5px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.x{width:26px;height:26px;border-radius:8px;border:none;background:#f3f4f6;color:#9ca3af;cursor:pointer;font-size:14px;transition:all .15s}
.x:hover{background:#fee2e2;color:var(--red)}
.add{width:100%;padding:12px;margin-top:10px;border:1.5px dashed #c9d4ea;border-radius:12px;background:none;color:var(--blue);font-size:13.5px;cursor:pointer;transition:all .15s}
.add:hover{background:var(--blue-soft);border-color:var(--blue)}

/* ===== 浏览器扩展卡片 ===== */
.bwrap{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bcard{width:150px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 12px;text-align:center;transition:border-color .18s,box-shadow .18s;display:flex;flex-direction:column;align-items:center}
.bcard:hover{border-color:#c9d4ea;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.blogo{width:44px;height:44px;margin:0 auto 10px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:700}
.blogo.rel{position:relative}
.bimg{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.bname{font-size:13.5px;font-weight:600;margin-bottom:14px}
.bcard .btn{width:100%;margin-top:auto}

/* ===== 弹窗 ===== */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:90;display:none;align-items:center;justify-content:center}
.mask.show{display:flex}
.modal{width:360px;background:var(--card);border-radius:18px;padding:22px;box-shadow:0 18px 50px rgba(15,23,42,.25);animation:in .22s ease}
.tabs{display:flex;background:#f1f3f6;border-radius:10px;padding:3px;margin:14px 0 16px}
.tab{flex:1;text-align:center;font-size:12.5px;padding:7px;border-radius:8px;cursor:pointer;color:#5b6472}
.tab.on{background:#fff;color:var(--txt);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.code{font-size:34px;letter-spacing:9px;text-align:center;font-weight:750;color:var(--blue);padding:16px 0 6px;font-variant-numeric:tabular-nums}
.wait{text-align:center;font-size:12.5px;color:var(--sub);margin-bottom:6px}
input.codein{width:100%;font-size:24px;letter-spacing:8px;text-align:center;padding:11px;border:1.5px solid var(--line);border-radius:12px;outline:none;font-variant-numeric:tabular-nums}
input.codein:focus{border-color:var(--blue)}

/* 便签弹窗 */
.note{width:560px;max-width:92vw;background:var(--card);border-radius:16px;padding:18px;box-shadow:0 18px 50px rgba(15,23,42,.25);animation:in .22s ease}
.note-body{height:52vh;overflow:auto;user-select:text;cursor:text;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word}

/* ===== 拖拽覆盖层 & 通知 ===== */
.drop{position:fixed;inset:10px;border:2.5px dashed var(--blue);border-radius:18px;background:rgba(37,99,235,.07);z-index:80;display:none;align-items:center;justify-content:center}
.drop.show{display:flex}
.drop span{font-size:16px;font-weight:600;color:var(--blue);background:#fff;padding:12px 22px;border-radius:99px;box-shadow:0 6px 24px rgba(37,99,235,.2)}
.toasts{position:fixed;left:0;right:0;top:36%;z-index:99;display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none}
.toast{pointer-events:auto;background:#111827;color:#f9fafb;font-size:13px;padding:12px 16px;border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.3);animation:in .25s ease;max-width:72vw;display:flex;align-items:center;gap:10px;user-select:text}
.toast span{white-space:pre-wrap;word-break:break-all}
.toast.err{background:#7f1d1d}
.tclose{border:none;background:rgba(255,255,255,.14);color:#f9fafb;width:22px;height:22px;border-radius:7px;cursor:pointer;font-size:12px;flex:none}
.tclose:hover{background:rgba(255,255,255,.28)}
.tbtn{flex:none;padding:4px 10px;font-size:12px}
</style>
</head>
<body>
<div class="topbar">
  <div class="dev" id="dev">
    <button class="dev-btn" onclick="devToggle(event)">
      <span class="dot off" id="devDot"></span><span class="name" id="devName">…</span>
      <svg class="caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6z"/></svg>
    </button>
    <div class="dev-menu" id="devMenu"></div>
  </div>
</div>
<div class="app">
  <div class="side" id="side">
    <div class="nav" data-c="doc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>文件</div>
    <div class="nav" data-c="aud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>音频</div>
    <div class="nav" data-c="pic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>图片</div>
    <div class="nav" data-c="vid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M22 8l-6 4 6 4z"/></svg>视频</div>
    <div class="nav" data-c="txt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>文本</div>
    <div class="spacer"></div>
    <div class="nav gear" id="gear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>设置</div>
  </div>
  <div class="main" id="main"></div>
</div>

<div class="drop" id="dropOv"><span>松开发送到「<b id="dropTarget">…</b>」</span></div>
<div class="toasts" id="toasts"></div>

<div class="mask" id="pairMask">
  <div class="modal">
    <b>添加设备</b>
    <div class="tabs">
      <div class="tab on" id="tabA">本机显示配对码</div>
      <div class="tab" id="tabB">输入对方配对码</div>
    </div>
    <div id="pairA">
      <div class="code" id="pairCode">······</div>
      <div class="wait" id="pairWait">5 分钟内有效 · 对方加入时在这里确认</div>
      <div id="pairAsk" style="display:none">
        <div class="wait" style="color:var(--txt);font-weight:600" id="askName"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn" style="flex:1;padding:9px" onclick="decide(false)">拒绝</button>
          <button class="btn pri" style="flex:1;padding:9px" onclick="decide(true)">允许加入</button>
        </div>
      </div>
    </div>
    <div id="pairB" style="display:none">
      <input class="codein" id="codeIn" maxlength="7" placeholder="······">
      <div class="wait" style="margin-top:8px">输入对方设备上显示的 6 位配对码</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn" style="flex:1;padding:9px" onclick="pairClose()">关闭</button>
      <button class="btn pri" id="joinBtn" style="flex:1;padding:9px;display:none" onclick="joinGo()">加入</button>
    </div>
  </div>
</div>

<div class="mask" id="noteMask">
  <div class="note">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <b id="noteMeta" style="font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b>
      <button class="btn" onclick="copyNote()">复制全文</button>
      <button class="x" onclick="ui('noteMask',0)">✕</button>
    </div>
    <div class="note-body" id="noteBody"></div>
  </div>
</div>

<div class="mask" id="helpMask">
  <div class="modal" style="width:440px;text-align:left">
    <b id="helpTitle">安装说明</b>
    <div id="helpBody" style="font-size:12.5px;color:#374151;line-height:1.8;margin-top:12px"></div>
    <button class="btn pri" style="width:100%;padding:9px;margin-top:14px" onclick="ui('helpMask',0)">知道了</button>
  </div>
</div>

  <div class="modal" style="width:320px;text-align:center">

<script>
/* ===== 基础 ===== */
const T = new URLSearchParams(location.search).get("t") || "";
const api = (p, o) => fetch("/api/" + p + (p.includes("?") ? "&" : "?") + "t=" + T, o);
const j = (p, o) => api(p, Object.assign({headers: {"Content-Type": "application/json"}}, o || {})).then(r => r.json());
function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;") }
/* jsStr 输出可安全嵌入单引号 HTML 属性内联事件中的 JS 字符串字面量：
   JSON.stringify 负责 JS 层转义，esc 负责 HTML 层转义（&#39; 解码后是 '，
   在双引号 JSON 字符串中只是普通字符，不会终止字符串）。 */
function jsStr(s) { return esc(JSON.stringify(String(s ?? ""))) }
function ui(id, on) { document.getElementById(id).classList.toggle("show", on) }
function toast(msg, opts) {
  if (typeof opts === "boolean") opts = {err: opts};
  opts = opts || {};
  const sticky = !!opts.sticky || !!opts.err;
  const t = document.createElement("div");
  t.className = "toast" + (opts.err ? " err" : "");
  const span = document.createElement("span"); span.textContent = msg; t.appendChild(span);
  if (opts.copy) { const b = document.createElement("button"); b.className = "btn tbtn"; b.textContent = "复制";
    b.onclick = () => { navigator.clipboard.writeText(msg); toast("已复制到剪贴板") }; t.appendChild(b) }
  const x = document.createElement("button"); x.className = "tclose"; x.textContent = "✕";
  x.onclick = () => t.remove(); t.appendChild(x);

function dropURL(a, path) { api(a + "?path=" + encodeURIComponent(path)).then(r => r.json()).then(r => { if (!r.ok) toast(r.message || "操作失败", {err:true,sticky:true}) }).catch(() => toast("操作失败", {err:true,sticky:true})) }

function textList() { return S.history.filter(x => x.kind === "text" && (filt === "all" || x.dir === filt)).slice().reverse() }
function fileList() { return S.history.filter(e => e.kind !== "text" && catOf(e) === cat && (filt === "all" || e.dir === filt)).slice().reverse() }
function currentList() { return cat === "txt" ? textList() : fileList() }
function catOf(e) {
  if (e.kind === "text") return "txt";
  const ext = ((e.name || "").split(".").pop() || "").toLowerCase();
  if (["mp3","flac","wav","m4a","ogg","aac"].includes(ext)) return "aud";
  if (["jpg","jpeg","png","gif","webp","bmp","svg","heic"].includes(ext)) return "pic";
  if (["mp4","mkv","mov","avi","webm","flv","wmv"].includes(ext)) return "vid";

function fmtT(iso) {
  const d = new Date(iso); if (isNaN(d)) return "";
  const n = new Date();

  const hm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");

function toggleCheck(id) { checked.has(id) ? checked.delete(id) : checked.add(id); render() }

function fileRow(e) {

/* ===== 交互 ===== */
document.querySelectorAll("#side .nav[data-c]").forEach(n => {
  n.onclick = () => { view = "list"; cat = n.dataset.c;
    document.querySelectorAll("#side .nav").forEach(x => x.classList.remove("on"));
    document.getElementById("gear").classList.remove("on");
    n.classList.add("on"); render(); };
});
document.getElementById("gear").onclick = () => {
  view = view === "set" ? "list" : "set";
  document.getElementById("gear").classList.toggle("on", view === "set");
  document.querySelectorAll("#side .nav").forEach(x => x.classList.remove("on"));
  render();
};
function devToggle(e) {
  e.stopPropagation();
  const d = document.getElementById("dev");
  if (d.classList.toggle("open")) {
    document.getElementById("devMenu").innerHTML = S.devices.map(d =>
      `<div class="dev-item" onclick='devPick(${jsStr(d.id)})'><span class="dot ${d.online ? "on" : "off"}"></span>
       ${esc(d.name)}<span class="id">${d.online ? "在线" : "离线"}</span></div>`).join("")
      || '<div class="dev-item">还没有已配对设备</div>';
  }
}
function devPick(id) {
  j("select", {method:"POST", body:JSON.stringify({id})}).then(() => refresh());
  document.getElementById("dev").classList.remove("open");
}
document.addEventListener("click", e => {
  if (!document.getElementById("dev").contains(e.target))
    document.getElementById("dev").classList.remove("open");
});
function sendText() {
  const ta = document.getElementById("ta");
  if (!ta.value.trim()) return toast("先写点内容", {err:true});
  j("send-text", {method:"POST", body:JSON.stringify({text:ta.value})})
   .then(r => { if (r.ok) { ta.value = ""; toast("已发送到「" + targetName() + "」") } else toast(r.message || "发送失败", {err:true,sticky:true}) })
   .catch(() => toast("发送失败", {err:true,sticky:true}));
}
function rmDev(id, name) {
  if (!confirm("移除设备「" + name + "」？双方都需要重新配对才能再次传输。")) return;
  j("device/remove", {method:"POST", body:JSON.stringify({id})}).then(() => { toast("已移除 " + name); refresh() });
}
function pickDir() {
  api("pick-dir", {method:"POST"}).then(r => r.json()).then(r => {
    if (r.ok) { refresh(); toast("接收文件夹已更改") }
    else toast(r.message || "未选择文件夹", {err:true,sticky:true});
  }).catch(() => toast("操作失败", {err:true,sticky:true}));
}
function doUnlock() {
  j("unlock", {method:"POST"}).then(() => { ui("unlockMask", 0); toast("已解锁，设备数量不再受限"); refresh() })
   .catch(() => toast("解锁失败", {err:true,sticky:true}));
}
function copyUS() {
  fetch(S.userscript_url).then(r => r.text()).then(t => {
    navigator.clipboard.writeText(t);
    toast("脚本已复制：Tampermonkey → 添加新脚本 → 粘贴 → Ctrl+S 保存", {sticky:true,copy:true});
  }).catch(() => toast("复制失败", {err:true,sticky:true}));
}

  const H = {
    ff: {t: "Firefox 安装说明", c:
      "<p>1. 需要 <b>Firefox Developer Edition</b>（正式版签名锁死，无法安装）。</p>" +
      "<p>2. 点「安装」登记扩展目录（一次性，已登记则跳过）。</p>" +
      "<p>3. 签名豁免：以<b>管理员</b>运行 drop install 自动写入 Firefox；或手动 about:config → xpinstall.signatures.required → false。</p>" +
      "<p>4. 重启 Firefox，扩展列表出现 Drop。</p>" +
      "<p>使用：网页里划选/右键 → 右键菜单发送；目标 = 面板选中的设备。</p>"},
    ec: {t: "Edge · Chrome 安装说明", c:
      "<p>1. 点「打开目录」。</p>" +
      "<p>2. 浏览器扩展页（edge://extensions 或 chrome://extensions）开启<b>开发者模式</b>。</p>" +
      "<p>3. 点「加载已解压的扩展程序」→ 选择该目录。</p>" +
      "<p>4. 更新代码后回到扩展页点刷新即可。</p>" +
      "<p>使用：网页里右键 → 发送页面 / 选中文本 / 链接 / 图片 / 视频。</p>"},
    tm: {t: "篡改猴（Tampermonkey）安装说明", c:
      "<p>1. 先安装 Tampermonkey 扩展（官方商店一键安装，正式版 Firefox 可用）。</p>" +
      "<p>2. 点「复制脚本」→ Tampermonkey → 添加新脚本 → 全选粘贴 → Ctrl+S 保存。</p>" +
      "<p>3. 也可「复制安装链接」在地址栏打开，Tampermonkey 会弹出安装。</p>" +
      "<p>使用：划选文字出现「发送到 Columba」按钮；或 Tampermonkey 菜单：发送当前页面 / 选中文本剪贴板 / 右键的图片视频。</p>"}
  }[b];
  document.getElementById("helpTitle").textContent = H.t;
  document.getElementById("helpBody").innerHTML = H.c;
  ui("helpMask", 1);
}
/* 配对 */
let pairPoll = null;
function pairOpen() {
  ui("pairMask", 1);
  document.getElementById("pairAsk").style.display = "none";
  j("pair/start", {method:"POST"}).then(r => {
    document.getElementById("pairCode").textContent = r.code ? r.code.slice(0,3) + " " + r.code.slice(3) : "······";
  }).catch(() => toast("进入配对模式失败", {err:true,sticky:true}));
  pairPoll = setInterval(() => {
    j("pair/pending").then(p => {
      if (p.waiting) {
        document.getElementById("pairWait").style.display = "none";
        document.getElementById("pairAsk").style.display = "block";
        document.getElementById("askName").textContent = "配对请求来自 " + p.name;
      }
    });
  }, 1200);
}
function decide(allow) {
  j("pair/decision", {method:"POST", body:JSON.stringify({allow})}).then(() => {
    if (allow) { toast("已允许加入"); pairClose(); refresh() }
    else { document.getElementById("pairAsk").style.display = "none";
           document.getElementById("pairWait").style.display = "block"; toast("已拒绝") }
  });
}
function pairTab(b) {
  document.getElementById("tabA").classList.toggle("on", !b);
  document.getElementById("tabB").classList.toggle("on", !!b);
  document.getElementById("pairA").style.display = b ? "none" : "block";
  document.getElementById("pairB").style.display = b ? "block" : "none";
  document.getElementById("joinBtn").style.display = b ? "block" : "none";
}
document.getElementById("tabA").onclick = () => pairTab(0);
document.getElementById("tabB").onclick = () => pairTab(1);
function joinGo() {
  const c = document.getElementById("codeIn").value.trim();
  if (!c) return toast("先输入配对码", {err:true});
  document.getElementById("joinBtn").textContent = "加入中…";
  j("pair/join", {method:"POST", body:JSON.stringify({code:c})}).then(r => {
    document.getElementById("joinBtn").textContent = "加入";
    if (r.ok) { toast("配对完成：" + r.name); pairClose(); refresh() }
    else toast(r.message || "配对失败", {err:true,sticky:true});
  }).catch(() => { document.getElementById("joinBtn").textContent = "加入"; toast("配对失败", {err:true,sticky:true}) });
}
function pairClose() { ui("pairMask", 0); if (pairPoll) { clearInterval(pairPoll); pairPoll = null } }
function openNote(i) {
  const e = textList()[i]; if (!e) return;
  document.getElementById("noteMeta").textContent = (e.dir === "recv" ? "← 收自 " : "→ 发给 ") + e.peer + " · " + fmtT(e.time);
  document.getElementById("noteBody").textContent = e.text;
  ui("noteMask", 1);
}
function copyNote() {
  const e = textList()[curNote];
  if (e) { navigator.clipboard.writeText(e.text); toast("全文已复制到剪贴板") }
}
let curNote = -1;
/* 拖拽 = 发送 */
let dragN = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragN++;
  document.getElementById("dropOv").classList.add("show");
  document.getElementById("dropTarget").textContent = targetName(); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("dragleave", e => { if (--dragN <= 0) { dragN = 0; document.getElementById("dropOv").classList.remove("show") } });
window.addEventListener("drop", e => {
  e.preventDefault(); dragN = 0; document.getElementById("dropOv").classList.remove("show");
  const fs = [...(e.dataTransfer.files || [])];
  if (!fs.length) return;
  const fd = new FormData();
  fs.forEach(f => fd.append("files", f, f.name));
  fetch("/api/send-files?t=" + T, {method:"POST", body:fd}).then(r => r.json()).then(r => {
    if (r.ok) toast("正在后台发送 " + fs.length + " 个文件 → " + targetName());
    else toast(r.message || "发送失败", {err:true,sticky:true});
  }).catch(() => toast("发送失败", {err:true,sticky:true}));
});
/* 状态轮询：数据变化且未在交互时才重绘 */
const lastSig = {v: ""};
function refresh() {
  api("state").then(r => r.json()).then(st => {
    S = st;
    const tdev = (S.devices || []).find(d => d.id === S.target);
    document.getElementById("devDot").className = "dot " + (tdev && tdev.online ? "on" : "off");
    document.getElementById("devName").textContent = targetName();
    const sig = JSON.stringify([st.devices, st.history, st.target, st.recv_dir, st.unlocked]);
    if (sig === lastSig.v) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")) return;
    if (document.getElementById("dev").classList.contains("open")) return;
    lastSig.v = sig;
    render();
  }).catch(() => {});
}
refresh();
setInterval(refresh, 3000);
const hq = new URLSearchParams(location.search).get("help");
if (hq) setTimeout(() => helpShow(hq), 400);
</script>
</body>
</html>
