/* ===== 主题变量：黑白单色 · 跟随系统（prefers-color-scheme） ===== */
:root{
  --bg:#FAFAF8;--main:#FFFFFF;--card:#FFFFFF;--card-2:#FFFFFF;
  --txt:#171716;--sub:#6E6E6A;--faint:#9A9A95;
  --line:#E4E4E0;--hairline:rgba(0,0,0,.08);--line-2:rgba(0,0,0,.16);
  --accent:#171716;--on-accent:#FAFAF8;
  --ok:#5F7A5B;--err:#A85A4C;
  --ok-tint:rgba(95,122,91,.14);--out-tint:rgba(23,23,22,.07);
  --fill-1:rgba(23,23,22,.05);--fill-2:rgba(23,23,22,.09);
  --mask:rgba(0,0,0,.35);--shadow:0 12px 36px rgba(0,0,0,.16);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0B0C;--main:#0B0B0C;--card:#151517;--card-2:#17171A;
    --txt:#F2F2F0;--sub:#8F8F8B;--faint:#777773;
    --line:#2A2A2D;--hairline:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.16);
    --accent:#F5F5F2;--on-accent:#0B0B0C;
    --ok:#8FAE8B;--err:#C08A7E;
    --ok-tint:rgba(143,174,139,.16);--out-tint:rgba(242,242,240,.10);
    --fill-1:rgba(255,255,255,.05);--fill-2:rgba(255,255,255,.09);
    --mask:rgba(0,0,0,.55);--shadow:0 16px 44px rgba(0,0,0,.55);
  }
}

/* ===== 基础 ===== */
html{color-scheme:light dark}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
body{background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;user-select:none}
input,textarea{font-family:inherit;color:var(--txt);background:transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}
::-webkit-scrollbar-track{background:transparent}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 35%,transparent)}50%{box-shadow:0 0 0 5px transparent}}

/* 按钮：主=反转强调实心（深底白/浅底黑），次=发丝描边 */
.btn{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--line-2);background:transparent;cursor:pointer;color:var(--txt);transition:border-color .15s,background .15s,opacity .15s,color .15s}
.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600}
.btn.pri:hover{opacity:.85}
.btn.errb{color:var(--err);border-color:var(--err)}
.btn.errb:hover{background:var(--err);color:#fff}

/* ===== 顶部条：设备选择 ===== */
.topbar{height:58px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--hairline);background:var(--bg)}
.topflex{flex:1}
.brand{font-family:"Caveat",cursive;font-size:20px;color:var(--faint);transform:rotate(-3deg);padding:0 4px;letter-spacing:.5px}
.dev{position:relative;width:200px}
.dev-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;background:transparent;border:1px solid var(--line-2);border-radius:12px;cursor:pointer;color:var(--txt);transition:border-color .18s}
.dev-btn:hover{border-color:var(--sub)}
.dev-btn .name{font-size:13.5px;font-weight:600;flex:1;text-align:left}
.dev-btn .caret{width:10px;height:10px;fill:var(--faint);transition:transform .18s;margin-left:auto}
.dev.open .caret{transform:rotate(180deg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.on{background:var(--ok);animation:pulse 2.2s infinite}
.dot.off{background:var(--faint)}
.dev-menu{position:absolute;top:46px;left:0;right:0;background:var(--card-2);border:1px solid var(--hairline);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);opacity:0;transform:scale(.97) translateY(-4px);pointer-events:none;transition:all .16s ease;z-index:50}
.dev.open .dev-menu{opacity:1;transform:none;pointer-events:auto}
.dev-item{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-size:13.5px}
.dev-item:hover{background:var(--fill-1)}
.dev-item .id{margin-left:auto;font-size:11px;color:var(--faint)}
.dev-alias{margin-left:6px;border:none;background:none;color:var(--faint);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:6px;line-height:1}
.dev-alias:hover{background:var(--fill-2);color:var(--txt)}

/* ===== 主框架 ===== */
.app{display:flex;height:calc(100vh - 58px)}
.side{width:172px;background:var(--bg);border-right:1px solid var(--hairline);display:flex;flex-direction:column;padding:10px 10px 14px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--sub);font-size:14px;transition:background .18s,color .18s}
.nav svg{width:17px;height:17px;flex:none}
.nav:hover{color:var(--txt);background:var(--fill-1)}
.nav.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.side .spacer{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--main)}

/* ===== 列表页 ===== */
.head{padding:18px 26px 10px;display:flex;align-items:center;gap:12px}
.head h1{font-size:19px;font-weight:700}
.head .count{font-size:12px;color:var(--faint)}
.head .flex{flex:1}
.seg{display:flex;background:var(--fill-1);border-radius:9px;padding:3px}
.seg b{font-size:12px;padding:4px 13px;border-radius:7px;cursor:pointer;color:var(--sub);font-weight:500;transition:background .15s,color .15s}
.seg b.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.list{flex:1;overflow-y:auto;padding:2px 18px 18px}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:64px 0}
.quote{font-family:"Caveat",cursive;font-size:20px;color:var(--faint);margin-top:8px}

/* 文件行：五列定宽对齐（图标38｜文件名弹性｜胶囊148｜时间52｜状态26｜操作118） */
.row{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:12px;background:var(--card);margin-bottom:8px;border:1px solid var(--hairline);transition:border-color .18s}
.row:hover{border-color:var(--sub)}
.row.cur{cursor:pointer}
.fico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--fill-1);color:var(--sub)}
.fico svg{width:19px;height:19px}
.fmeta{flex:1;min-width:0}
.fname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;padding:4px 0;border-radius:99px;white-space:nowrap;flex:none;width:148px;text-align:center;overflow:hidden;text-overflow:ellipsis}
.chip.in{background:var(--ok-tint);color:var(--ok)}
.chip.out{background:var(--out-tint);color:var(--sub)}
.time{font-size:12px;color:var(--faint);width:52px;text-align:right;flex:none}
.st{width:26px;text-align:center;font-size:15px;font-weight:700;flex:none}
.st.ok{color:var(--ok)}
.st.bad{color:var(--err)}
.acts{display:flex;gap:6px;opacity:0;transition:opacity .18s;min-width:118px;justify-content:flex-end;flex:none}
.row:hover .acts{opacity:1}
.ck{width:16px;height:16px;accent-color:var(--accent);flex:none;cursor:pointer}

/* 文本页 */
.composer{margin:0 18px 14px;background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:13px;transition:border-color .18s}
.composer:focus-within{border-color:var(--sub)}
.composer textarea{width:100%;height:76px;border:none;outline:none;resize:none;font-size:15px;line-height:1.55;font-family:inherit;color:var(--txt)}
.composer .bar{display:flex;justify-content:flex-end}
.tcard{cursor:pointer;display:flex;gap:10px;background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:13px 15px;margin:0 18px 8px;transition:border-color .18s}
.tcard:hover{border-color:var(--sub)}
.tmain{flex:1;min-width:0}
.tcard .thead{display:flex;align-items:center;font-size:12px;color:var(--faint);margin-bottom:7px}
.tcard .tbody{font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;height:70px;overflow:hidden}

/* ===== 设置页（模块间距 26 · 可滚动） ===== */
.set{flex:1;overflow-y:auto;padding:8px 26px 28px;max-width:620px;margin:0 auto;width:100%}
.set h2{font-size:13px;color:var(--sub);font-weight:500;margin:26px 0 8px}
.set > h2:first-of-type{margin-top:14px}
.setcard{background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:4px 16px}
.setrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--hairline)}
.setrow:last-child{border-bottom:none}
.setrow .k{font-size:13px;font-weight:500;flex:none}
.setrow .v{font-size:12px;color:var(--faint);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.x{width:26px;height:26px;border-radius:8px;border:none;background:var(--fill-1);color:var(--faint);cursor:pointer;font-size:13px;transition:background .15s,color .15s}
.x:hover{background:var(--err);color:#fff}
.add{width:100%;padding:9px;margin-top:10px;border:1px solid var(--line-2);border-radius:12px;background:none;color:var(--txt);font-size:13px;cursor:pointer;transition:border-color .15s}
.add:hover{border-color:var(--sub)}
.unlock-entry{text-align:center;font-size:12px;color:var(--faint);margin:10px 0 4px;cursor:pointer;transition:color .15s}
.unlock-entry:hover{color:var(--sub)}
/* 自启开关 */
.sw{position:relative;width:40px;height:22px;flex:none;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .kn{position:absolute;inset:0;border-radius:11px;background:var(--fill-2);transition:background .18s}
.sw .kn::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--card);border:1px solid var(--hairline);transition:transform .18s}
.sw input:checked + .kn{background:var(--accent)}
.sw input:checked + .kn::after{transform:translateX(18px)}

/* ===== 浏览器扩展卡片（按钮统一实心反转强调） ===== */
.bwrap{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bcard{width:150px;cursor:pointer;background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:14px 12px;text-align:center;transition:border-color .18s;display:flex;flex-direction:column;align-items:center}
.bcard:hover{border-color:var(--sub)}
.blogo{width:40px;height:40px;margin:0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center}
.blogo.rel{position:relative}
.blogo-tm{background:var(--bg);border:1px solid var(--line-2);color:var(--txt);font-size:13px;font-weight:700}
.bimg{width:40px;height:40px;object-fit:contain}
.bname{font-size:13px;font-weight:500;margin:8px 0 10px}
.bcard .btn{width:100%;margin-top:auto}

/* ===== 弹窗 ===== */
.mask{position:fixed;inset:0;background:var(--mask);z-index:90;display:none;align-items:center;justify-content:center}
.mask.show{display:flex}
.modal{width:360px;background:var(--card);border:1px solid var(--hairline);border-radius:16px;padding:22px;box-shadow:var(--shadow);animation:in .22s ease}
.tabs{display:flex;background:var(--fill-1);border-radius:10px;padding:3px;margin:14px 0 16px}
.tab{flex:1;text-align:center;font-size:12.5px;padding:7px;border-radius:8px;cursor:pointer;color:var(--sub);transition:background .15s,color .15s}
.tab.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.code{font-size:34px;letter-spacing:9px;text-align:center;font-weight:700;color:var(--txt);padding:16px 0 6px;font-variant-numeric:tabular-nums}
.wait{text-align:center;font-size:12.5px;color:var(--sub);margin-bottom:6px}
input.codein{width:100%;font-size:24px;letter-spacing:8px;text-align:center;padding:11px;border:1.5px solid var(--line-2);border-radius:12px;outline:none;font-variant-numeric:tabular-nums;color:var(--txt)}
input.codein:focus{border-color:var(--sub)}

/* 便签弹窗（52vh 固定 · 可选中） */
.note{width:560px;max-width:92vw;background:var(--card);border:1px solid var(--hairline);border-radius:16px;padding:18px;box-shadow:var(--shadow);animation:in .22s ease}
.note-body{height:52vh;overflow:auto;user-select:text;cursor:text;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word}

/* ===== 拖拽覆盖层 & 通知 ===== */
.drop{position:fixed;inset:10px;border:2px dashed var(--line-2);border-radius:18px;background:color-mix(in srgb,var(--bg) 82%,transparent);z-index:80;display:none;align-items:center;justify-content:center}
.drop.show{display:flex}
.drop span{font-size:15px;font-weight:600;color:var(--txt);background:var(--card);border:1px solid var(--hairline);padding:12px 22px;border-radius:99px;box-shadow:var(--shadow)}
.toasts{position:fixed;left:0;right:0;top:36%;z-index:99;display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none}
.toast{pointer-events:auto;background:var(--accent);color:var(--on-accent);font-size:13px;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);animation:in .25s ease;max-width:72vw;display:flex;align-items:center;gap:10px;user-select:text}
.toast span{white-space:pre-wrap;word-break:break-all}
.toast.err{background:var(--err);color:#fff}
.tclose{border:none;background:rgba(127,127,127,.28);color:inherit;width:22px;height:22px;border-radius:7px;cursor:pointer;font-size:12px;flex:none}
.tclose:hover{background:rgba(127,127,127,.45)}
.toast .tbtn{color:inherit;border-color:rgba(127,127,127,.5);background:transparent}
</style>

<script>
/* ===== 基础 ===== */
const T = new URLSearchParams(location.search).get("t") || "";
const api = (p, o) => fetch("/api/" + p + (p.includes("?") ? "&" : "?") + "t=" + T, o);
const j = (p, o) => api(p, Object.assign({headers: {"Content-Type": "application/json"}}, o || {})).then(r => r.json());
function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;") }
/* jsStr 输出可安全嵌入单引号 HTML 属性内联事件中的 JS 字符串字面量：
   JSON.stringify 负责 JS 层转义，esc 负责 HTML 层转义（&#39; 解码后是 '，
   在双引号 JSON 字符串中只是普通字符，不会终止字符串）。 */
function jsStr(s) { return esc(JSON.stringify(String(s ?? ""))) }
function ui(id, on) { document.getElementById(id).classList.toggle("show", on) }
function toast(msg, opts) {
  if (typeof opts === "boolean") opts = {err: opts};
  opts = opts || {};
  const sticky = !!opts.sticky || !!opts.err;
  const t = document.createElement("div");
  t.className = "toast" + (opts.err ? " err" : "");
  const span = document.createElement("span"); span.textContent = msg; t.appendChild(span);
  if (opts.copy) { const b = document.createElement("button"); b.className = "btn tbtn"; b.textContent = "复制";
    b.onclick = () => { navigator.clipboard.writeText(msg); toast("已复制到剪贴板") }; t.appendChild(b) }
  const x = document.createElement("button"); x.className = "tclose"; x.textContent = "✕";
  x.onclick = () => t.remove(); t.appendChild(x);
  document.getElementById("toasts").appendChild(t);
  if (!sticky) setTimeout(() => { t.style.opacity = 0; t.style.transition = "opacity .4s"; setTimeout(() => t.remove(), 400) }, 2600);
}
function dropURL(a, path) { api(a + "?path=" + encodeURIComponent(path)).then(r => r.json()).then(r => { if (!r.ok) toast(r.message || "操作失败", {err:true,sticky:true}) }).catch(() => toast("操作失败", {err:true,sticky:true})) }

/* ===== 数据与渲染 ===== */
let S = null, cat = "doc", filt = "all", view = "list", manage = false;
const checked = new Set();
const ICON = {
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
  aud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  pic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  vid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M22 8l-6 4 6 4z"/></svg>',
  txt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>'};
const CLS = {doc:"f-doc",aud:"f-aud",pic:"f-img",vid:"f-vid",txt:"f-txt"};
const TITLES = {doc:"文件",aud:"音频",pic:"图片",vid:"视频",txt:"文本"};
const FILTERS = [["all","全部"],["recv","收到"],["send","发出"]];
function textList() { return S.history.filter(x => x.kind === "text" && (filt === "all" || x.dir === filt)).slice().reverse() }
function fileList() { return S.history.filter(e => e.kind !== "text" && catOf(e) === cat && (filt === "all" || e.dir === filt)).slice().reverse() }
function currentList() { return cat === "txt" ? textList() : fileList() }
function catOf(e) {
  if (e.kind === "text") return "txt";
  const ext = ((e.name || "").split(".").pop() || "").toLowerCase();
  if (["mp3","flac","wav","m4a","ogg","aac"].includes(ext)) return "aud";
  if (["jpg","jpeg","png","gif","webp","bmp","svg","heic"].includes(ext)) return "pic";
  if (["mp4","mkv","mov","avi","webm","flv","wmv"].includes(ext)) return "vid";
  return "doc";
}
function fmtT(iso) {
  const d = new Date(iso); if (isNaN(d)) return "";
  const n = new Date();
  const md = String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const hm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  return d.toDateString() === n.toDateString() ? hm : md + " " + hm;
}
function targetName() {
  const d = (S && S.devices || []).find(d => d.id === S.target);
  return d ? d.name : (S && S.target ? S.target.slice(0, 9) + "…" : "未选择");
}
function segHTML() {
  return `<div class="seg">${FILTERS.map(([k, l]) =>
    `<b class="${filt === k ? "on" : ""}" onclick="setFilt('${k}')">${l}</b>`).join("")}</div>`;
}
function setFilt(f) { filt = f; render() }
function toggleCheck(id) { checked.has(id) ? checked.delete(id) : checked.add(id); render() }
function manageControls() {
  if (!manage) return `<button class="btn" onclick="enterManage()">管理</button>`;
  return `<button class="btn" onclick="checkAll(true)">全选</button><button class="btn" onclick="checkAll(false)">清空</button><button class="btn errb" onclick="delSel()">删除所选(${checked.size})</button><button class="btn" onclick="exitManage()">完成</button>`;
}
function enterManage() { manage = true; checked.clear(); render() }
function exitManage() { manage = false; checked.clear(); render() }
function checkAll(on) { for (const e of currentList()) on ? checked.add(e.id) : checked.delete(e.id); render() }
function delSel() {
  if (!checked.size) return toast("先勾选要删除的记录", {err:true,sticky:true});
  if (!confirm("删除选中的 " + checked.size + " 条记录？（只删记录，不删文件）")) return;
  j("history/delete", {method:"POST", body:JSON.stringify({ids:[...checked]})}).then(r => {
    checked.clear(); manage = false; refresh(); toast("已删除 " + (r.removed || 0) + " 条记录");
  }).catch(() => toast("删除失败", {err:true,sticky:true}));
}
function fileRow(e) {
  const recv = e.dir === "recv";
  const chip = recv ? `<span class="chip in">← 收到 · ${esc(e.peer)}</span>`
                    : `<span class="chip out">→ 发出 · ${esc(e.peer)}</span>`;
  const openable = e.status === "ok" && e.path;
  const acts = openable && !manage
    ? `<div class="acts"><button class="btn" onclick='event.stopPropagation();dropURL("open",${jsStr(e.path)})'>打开</button>
       <button class="btn" onclick='event.stopPropagation();dropURL("reveal",${jsStr(e.path)})'>定位</button></div>`
    : `<div class="acts"></div>`;
  const dbl = openable && !manage ? ` ondblclick='dropURL("open",${jsStr(e.path)})'` : "";
  const rowclick = manage ? ` onclick="toggleCheck('${e.id}')"` : dbl;
  const cur = openable && !manage ? " cur" : "";
  const ck = manage ? `<input type="checkbox" class="ck" ${checked.has(e.id) ? "checked" : ""} onclick="event.stopPropagation();toggleCheck('${e.id}')">` : "";
  return `<div class="row${cur}"${rowclick}>${ck}<div class="fico ${CLS[cat]}">${ICON[cat]}</div>
   <div class="fmeta"><div class="fname">${esc(e.name)}</div></div>
   ${chip}<span class="time">${fmtT(e.time)}</span>
   <span class="st ${e.status === "ok" ? "ok" : "bad"}">${e.status === "ok" ? "✓" : "✗"}</span>${acts}</div>`;
}
function tcard(e, i) {
  const dir = e.dir === "recv" ? "←" : "→";
  const ck = manage ? `<input type="checkbox" class="ck" ${checked.has(e.id) ? "checked" : ""} onclick="event.stopPropagation();toggleCheck('${e.id}')">` : "";
  const click = manage ? ` onclick="toggleCheck('${e.id}')"` : ` onclick="openNote(${i})"`;
  return `<div class="tcard"${click} title="${manage ? "" : "点击查看全文"}">${ck}
   <div class="tmain"><div class="thead">${dir} ${esc(e.peer)} · ${fmtT(e.time)}</div>
   <div class="tbody">${esc(e.text)}</div></div></div>`;
}
function render() {
  const m = document.getElementById("main");
  if (!S) return;
  // 同页重绘（轮询刷新）保留滚动位置；切视图/分类/筛选才回顶部
  const key = view + ":" + cat + ":" + filt + ":" + (manage ? 1 : 0);
  const samePage = key === renderKey;
  renderKey = key;
  const keepScroll = samePage ? m.scrollTop : 0;
  if (view === "set") { renderSet(m); m.scrollTop = keepScroll; return; }
  if (cat === "txt") {
    const texts = textList();
    m.innerHTML = `<div class="head"><h1>文本</h1>${segHTML()}
     <span class="count">划选文字点「发送」· 点击卡片查看全文</span><span class="flex"></span>${manageControls()}</div>
     <div class="composer"><textarea id="ta" placeholder="在这里输入或粘贴文字…"></textarea>
     <div class="bar"><button class="btn pri" onclick="sendText()">发送</button></div></div>
     <div class="list" style="padding-top:0">${texts.map(tcard).join("") ||
       '<div class="empty">该筛选下暂无文本<div class="quote">waiting for a drop…</div></div>'}</div>`;
    m.scrollTop = keepScroll;
    return;
  }
  const all = S.history.filter(e => e.kind !== "text" && catOf(e) === cat);
  const rows = fileList().map(fileRow).join("");
  m.innerHTML = `<div class="head"><h1>${TITLES[cat]}</h1>${segHTML()}
   <span class="count">${all.length} 条</span><span class="flex"></span>${manageControls()}</div>
   <div class="list">${rows || '<div class="empty">该筛选下暂无传输<div class="quote">waiting for a drop…</div></div>'}</div>`;
  m.scrollTop = keepScroll;
}

/* ===== 交互 ===== */
document.querySelectorAll("#side .nav[data-c]").forEach(n => {
  n.onclick = () => { view = "list"; cat = n.dataset.c;
    document.querySelectorAll("#side .nav").forEach(x => x.classList.remove("on"));
    document.getElementById("gear").classList.remove("on");
    n.classList.add("on"); render(); };
});
document.getElementById("gear").onclick = () => {
  view = view === "set" ? "list" : "set";
  document.getElementById("gear").classList.toggle("on", view === "set");
  document.querySelectorAll("#side .nav").forEach(x => x.classList.remove("on"));
  render();
};
function devToggle(e) {
  e.stopPropagation();
  const d = document.getElementById("dev");
  if (d.classList.toggle("open")) {
    document.getElementById("devMenu").innerHTML = S.devices.map(d =>
      `<div class="dev-item" onclick='devPick(${jsStr(d.id)})'><span class="dot ${d.online ? "on" : "off"}"></span>
       ${esc(d.name)}<span class="id">${d.online ? "在线" : "离线"}</span><button class="dev-alias" title="修改备注名" onclick='event.stopPropagation();aliasOpen(${jsStr(d.id)},${jsStr(d.name)})'>✎</button></div>`).join("")
      || '<div class="dev-item">还没有已配对设备</div>';
  }
}
function devPick(id) {
  j("select", {method:"POST", body:JSON.stringify({id})}).then(() => refresh());
  document.getElementById("dev").classList.remove("open");
}
let aliasId = "";
function aliasOpen(id, name) {
  aliasId = id;
  document.getElementById("aliasDev").textContent = name;
  document.getElementById("aliasIn").value = "";
  document.getElementById("dev").classList.remove("open");
  ui("aliasMask", 1);
  setTimeout(() => document.getElementById("aliasIn").focus(), 60);
}
function aliasSave() {
  const v = document.getElementById("aliasIn").value.trim();
  j("alias", {method:"POST", body:JSON.stringify({id:aliasId, alias:v})})
    .then(() => { ui("aliasMask", 0); toast("备注已保存"); refresh(); })
    .catch(() => toast("保存失败", {err:true,sticky:true}));
}
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.getElementById("aliasMask").classList.contains("show")) aliasSave();
});
document.addEventListener("click", e => {
  if (!document.getElementById("dev").contains(e.target))
    document.getElementById("dev").classList.remove("open");
});
function sendText() {
  const ta = document.getElementById("ta");
  if (!ta.value.trim()) return toast("先写点内容", {err:true});
  j("send-text", {method:"POST", body:JSON.stringify({text:ta.value})})
   .then(r => { if (r.ok) { ta.value = ""; toast("已发送到「" + targetName() + "」") } else toast(r.message || "发送失败", {err:true,sticky:true}) })
   .catch(() => toast("发送失败", {err:true,sticky:true}));
}
function rmDev(id, name) {
  if (!confirm("移除设备「" + name + "」？双方都需要重新配对才能再次传输。")) return;
  j("device/remove", {method:"POST", body:JSON.stringify({id})}).then(() => { toast("已移除 " + name); refresh() });
}
function pickDir() {
  api("pick-dir", {method:"POST"}).then(r => r.json()).then(r => {
    if (r.ok) { refresh(); toast("接收文件夹已更改") }
    else toast(r.message || "未选择文件夹", {err:true,sticky:true});
  }).catch(() => toast("操作失败", {err:true,sticky:true}));
}
function doUnlock() {
  j("unlock", {method:"POST"}).then(() => { ui("unlockMask", 0); toast("已解锁，设备数量不再受限"); refresh() })
   .catch(() => toast("解锁失败", {err:true,sticky:true}));
}
function copyUS() {
  fetch(S.userscript_url).then(r => r.text()).then(t => {
    navigator.clipboard.writeText(t);
    toast("脚本已复制：Tampermonkey → 添加新脚本 → 粘贴 → Ctrl+S 保存", {sticky:true,copy:true});
  }).catch(() => toast("复制失败", {err:true,sticky:true}));
}

/* 配对 */
let pairPoll = null;
function pairOpen() {
  ui("pairMask", 1);
  document.getElementById("pairAsk").style.display = "none";
  j("pair/start", {method:"POST"}).then(r => {
    document.getElementById("pairCode").textContent = r.code ? r.code.slice(0,3) + " " + r.code.slice(3) : "······";
  }).catch(() => toast("进入配对模式失败", {err:true,sticky:true}));
  pairPoll = setInterval(() => {
    j("pair/pending").then(p => {
      if (p.waiting) {
        document.getElementById("pairWait").style.display = "none";
        document.getElementById("pairAsk").style.display = "block";
        document.getElementById("askName").textContent = "配对请求来自 " + p.name;
      }
    });
  }, 1200);
}
function decide(allow) {
  j("pair/decision", {method:"POST", body:JSON.stringify({allow})}).then(() => {
    if (allow) { toast("已允许加入"); pairClose(); refresh() }
    else { document.getElementById("pairAsk").style.display = "none";
           document.getElementById("pairWait").style.display = "block"; toast("已拒绝") }
  });
}
function pairTab(b) {
  document.getElementById("tabA").classList.toggle("on", !b);
  document.getElementById("tabB").classList.toggle("on", !!b);
  document.getElementById("pairA").style.display = b ? "none" : "block";
  document.getElementById("pairB").style.display = b ? "block" : "none";
  document.getElementById("joinBtn").style.display = b ? "block" : "none";
}
document.getElementById("tabA").onclick = () => pairTab(0);
document.getElementById("tabB").onclick = () => pairTab(1);
function joinGo() {
  const c = document.getElementById("codeIn").value.trim();
  if (!c) return toast("先输入配对码", {err:true});
  document.getElementById("joinBtn").textContent = "加入中…";
  j("pair/join", {method:"POST", body:JSON.stringify({code:c})}).then(r => {
    document.getElementById("joinBtn").textContent = "加入";
    if (r.ok) { toast("配对完成：" + r.name); pairClose(); refresh() }
    else toast(r.message || "配对失败", {err:true,sticky:true});
  }).catch(() => { document.getElementById("joinBtn").textContent = "加入"; toast("配对失败", {err:true,sticky:true}) });
}
function pairClose() { ui("pairMask", 0); if (pairPoll) { clearInterval(pairPoll); pairPoll = null } }
function openNote(i) {
  const e = textList()[i]; if (!e) return;
  document.getElementById("noteMeta").textContent = (e.dir === "recv" ? "← 收自 " : "→ 发给 ") + e.peer + " · " + fmtT(e.time);
  document.getElementById("noteBody").textContent = e.text;
  ui("noteMask", 1);
}
function copyNote() {
  const e = textList()[curNote];
  if (e) { navigator.clipboard.writeText(e.text); toast("全文已复制到剪贴板") }
}
let curNote = -1;
/* 拖拽 = 发送 */
let dragN = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragN++;
  document.getElementById("dropOv").classList.add("show");
  document.getElementById("dropTarget").textContent = targetName(); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("dragleave", e => { if (--dragN <= 0) { dragN = 0; document.getElementById("dropOv").classList.remove("show") } });
window.addEventListener("drop", e => {
  e.preventDefault(); dragN = 0; document.getElementById("dropOv").classList.remove("show");
  const fs = [...(e.dataTransfer.files || [])];
  if (!fs.length) return;
  const fd = new FormData();
  fs.forEach(f => fd.append("files", f, f.name));
  fetch("/api/send-files?t=" + T, {method:"POST", body:fd}).then(r => r.json()).then(r => {
    if (r.ok) toast("正在后台发送 " + fs.length + " 个文件 → " + targetName());
    else toast(r.message || "发送失败", {err:true,sticky:true});
  }).catch(() => toast("发送失败", {err:true,sticky:true}));
});
/* 状态轮询：数据变化且未在交互时才重绘 */
const lastSig = {v: "", dev: ""};
let renderKey = "";
function refresh() {
  api("state").then(r => r.json()).then(st => {
    S = st;
    const tdev = (S.devices || []).find(d => d.id === S.target);
    document.getElementById("devDot").className = "dot " + (tdev && tdev.online ? "on" : "off");
    document.getElementById("devName").textContent = targetName();
    // 设备在线状态不参与整页重绘的判定：列表内容只来自历史记录，
    // 在线抖动只影响顶栏圆点（上面已直接更新），避免无谓的整页闪烁
    // 设备列表变化（移除/备注/改名同步）：设置视图的设备管理卡需刷新，
    // 列表视图不受影响（顶栏圆点已在上面直接更新）
    const devSig = JSON.stringify(st.devices);
    if (devSig !== lastSig.dev) {
      lastSig.dev = devSig;
      if (view === "set") { render(); return; }
    }
    const sig = JSON.stringify([st.history, st.target, st.recv_dir, st.unlocked]);
    if (sig === lastSig.v) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")) return;
    if (document.getElementById("dev").classList.contains("open")) return;
    lastSig.v = sig;
    render();
  }).catch(() => {});
}
refresh();
setInterval(refresh, 3000);
const hq = new URLSearchParams(location.search).get("help");
if (hq) setTimeout(() => helpShow(hq), 400);
</script>
